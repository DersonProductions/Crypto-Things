name: Test Example Scripts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ecdsa

    - name: Run and validate basic_hash.py
      run: |
        output=$(python examples/basic_hash.py)
        echo "$output"
        if [[ $output != *"breaking any chain"* ]]; then
          echo "Validation failed for basic_hash.py"
          exit 1
        fi

    - name: Run and validate ecdsa_signature.py
      run: |
        output=$(python examples/ecdsa_signature.py)
        echo "$output"
        if [[ $output != *"Verification Result: Valid"* ]] || [[ $output != *"Tampered Verification Result: Invalid"* ]]; then
          echo "Validation failed for ecdsa_signature.py"
          exit 1
        fi

    - name: Run and validate secure_key_management.py
      run: |
        output=$(python examples/secure_key_management.py)
        echo "$output"
        if [[ $output != *"Verification: Success"* ]] || [[ $output != *"Wrong Password Verification: Failure"* ]]; then
          echo "Validation failed for secure_key_management.py"
          exit 1
        fi